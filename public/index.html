<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双人飞行棋</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 首页 -->
<div id="home" class="screen">
  <div class="home-card">
    <h1>飞行棋</h1>
    <p class="subtitle">双人对战</p>
    <button class="btn btn-primary" onclick="startLocal()">本地双人</button>
    <button class="btn btn-success" onclick="showCreate()">创建房间</button>
    <button class="btn btn-warning" onclick="showJoin()">加入房间</button>
    <div id="joinBox" class="join-box" style="display:none">
      <input type="text" id="roomInput" maxlength="6" placeholder="输入6位房间号" class="room-input">
      <button class="btn btn-warning" onclick="joinRoom()">加入</button>
    </div>
    <div id="waitBox" class="wait-box" style="display:none">
      <p>房间号：<span id="roomIdDisplay" class="room-id"></span></p>
      <p class="waiting-text">等待对方加入...</p>
      <button class="btn btn-back" onclick="location.reload()">返回</button>
    </div>
    <p id="homeError" class="error-text"></p>
  </div>
</div>

<!-- 游戏界面 -->
<div id="game" class="screen" style="display:none">
  <!-- 玩家信息栏 -->
  <div class="players-bar">
    <div id="p0Info" class="player-info">
      <div class="player-avatar p0">P1</div>
      <div class="player-detail">
        <div class="player-name">玩家1</div>
        <div class="player-score"><span id="p0Score">15</span> 积分</div>
        <div class="player-equips" id="p0Equips"></div>
        <div class="player-items" id="p0Items"></div>
        <div class="player-finished" id="p0Finished"></div>
      </div>
    </div>
    <div id="p1Info" class="player-info">
      <div class="player-detail" style="text-align:right">
        <div class="player-name">玩家2</div>
        <div class="player-score"><span id="p1Score">15</span> 积分</div>
        <div class="player-equips" id="p1Equips"></div>
        <div class="player-items" id="p1Items"></div>
        <div class="player-finished" id="p1Finished"></div>
      </div>
      <div class="player-avatar p1">P2</div>
    </div>
  </div>

  <!-- 棋盘 -->
  <div class="board-wrap">
    <div id="board" class="board"></div>
  </div>

  <!-- 提示 -->
  <div id="hint" class="hint">轮到玩家1掷骰子</div>

  <!-- 骰子区域 -->
  <div class="dice-area">
    <div id="dice" class="dice" onclick="onDiceClick()">
      <div class="dice-face" id="diceFace"></div>
    </div>
    <button id="rerollBtn" class="btn btn-reroll" style="display:none" onclick="doReroll()">重投 (<span id="rerollCost">2</span>积分)</button>
  </div>

  <!-- 底部按钮 -->
  <div class="bottom-bar">
    <button class="btn btn-small" onclick="restartGame()">重新开始</button>
    <button class="btn btn-small" onclick="location.reload()">返回首页</button>
  </div>

  <!-- 日志 -->
  <div id="log" class="log"></div>
</div>

<!-- 任务弹窗 -->
<div id="taskModal" class="modal" style="display:none">
  <div class="modal-content card-draw">
    <h2>选择任务</h2>
    <div class="task-cards">
      <div class="task-card low" onclick="chooseTask(0)">
        <div class="task-bonus">+<span id="t0Bonus">0</span></div>
        <div class="task-score" id="t0Score">0</div>
        <div class="task-text" id="t0Text"></div>
      </div>
      <div class="task-card high" onclick="chooseTask(1)">
        <div class="task-bonus">+<span id="t1Bonus">0</span></div>
        <div class="task-score" id="t1Score">0</div>
        <div class="task-text" id="t1Text"></div>
      </div>
    </div>
  </div>
</div>

<!-- 事件弹窗 -->
<div id="eventModal" class="modal" style="display:none">
  <div class="modal-content event-draw">
    <div class="event-icon">⚡</div>
    <h2 id="eventName"></h2>
    <p id="eventDesc"></p>
    <button class="btn btn-primary" onclick="confirmEvent()">确定</button>
  </div>
</div>

<!-- 商店弹窗 -->
<div id="shopModal" class="modal" style="display:none">
  <div class="modal-content shop-content">
    <h2>商店</h2>
    <div id="shopItems" class="shop-items"></div>
    <button class="btn btn-back" onclick="closeShop()">离开商店</button>
  </div>
</div>

<!-- 脱装备弹窗 -->
<div id="clothesModal" class="modal" style="display:none">
  <div class="modal-content">
    <h2>跨层脱装备</h2>
    <p>选择脱掉一件装备，或花费积分免脱</p>
    <div id="clothesOptions" class="clothes-options"></div>
    <button class="btn btn-pay" id="payFreeBtn" onclick="payFree()">花<span id="freeCost">10</span>积分免脱</button>
    <button class="btn btn-card" id="freeCardBtn" style="display:none" onclick="useFreeCard()">使用免脱卡</button>
  </div>
</div>

<!-- 游戏结束弹窗 -->
<div id="overModal" class="modal" style="display:none">
  <div class="modal-content">
    <h2 id="overTitle"></h2>
    <p id="overScores"></p>
    <button class="btn btn-primary" onclick="restartGame()">再来一局</button>
    <button class="btn btn-back" onclick="location.reload()">返回首页</button>
  </div>
</div>

<!-- 对方断开提示 -->
<div id="disconnectModal" class="modal" style="display:none">
  <div class="modal-content">
    <h2>对方已断开连接</h2>
    <button class="btn btn-primary" onclick="location.reload()">返回首页</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
