<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星空飞行棋 · 双人对战</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  img, video { max-width: 100%; height: auto; display: block; }
  body { overflow-wrap: break-word; margin: 0; }

  :root {
    --bg: hsl(240, 18%, 6%);
    --bg-2: hsl(240, 15%, 10%);
    --surface: hsl(240, 12%, 14%);
    --surface-2: hsl(240, 10%, 18%);
    --border: hsl(240, 10%, 24%);
    --text: hsl(240, 20%, 95%);
    --text-muted: hsl(240, 10%, 60%);
    --p1: hsl(210, 95%, 60%);
    --p1-glow: hsla(210, 95%, 60%, 0.6);
    --p2: hsl(340, 88%, 62%);
    --p2-glow: hsla(340, 88%, 62%, 0.6);
    --gold: hsl(45, 95%, 60%);
    --green: hsl(145, 70%, 50%);
    --teal: hsl(175, 80%, 55%);
    --purple: hsl(270, 75%, 65%);
  }

  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
  }

  /* 星空背景 */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, hsla(210, 80%, 30%, 0.25), transparent 50%),
      radial-gradient(ellipse at 80% 80%, hsla(340, 70%, 25%, 0.2), transparent 50%),
      radial-gradient(ellipse at 50% 50%, hsla(270, 60%, 20%, 0.15), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 25% 30%, white, transparent),
      radial-gradient(1px 1px at 75% 60%, white, transparent),
      radial-gradient(1.5px 1.5px at 50% 15%, hsla(210, 90%, 80%, 0.9), transparent),
      radial-gradient(1px 1px at 10% 70%, white, transparent),
      radial-gradient(1px 1px at 90% 40%, hsla(340, 90%, 80%, 0.8), transparent),
      radial-gradient(1.5px 1.5px at 60% 85%, white, transparent),
      radial-gradient(1px 1px at 35% 50%, hsla(270, 80%, 80%, 0.7), transparent),
      radial-gradient(1px 1px at 85% 10%, white, transparent);
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
    animation: twinkle 4s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.3; }
    to { opacity: 0.6; }
  }

  .font-display { font-family: 'Orbitron', sans-serif; }

  .glass {
    background: linear-gradient(135deg, hsla(240, 15%, 16%, 0.8), hsla(240, 12%, 10%, 0.9));
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .glow-p1 { box-shadow: 0 0 20px var(--p1-glow), 0 0 40px var(--p1-glow), inset 0 0 10px hsla(210, 95%, 60%, 0.2); }
  .glow-p2 { box-shadow: 0 0 20px var(--p2-glow), 0 0 40px var(--p2-glow), inset 0 0 10px hsla(340, 88%, 62%, 0.2); }

  /* 棋盘格子 */
  .cell {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    transition: all 0.2s;
    border: 1px solid transparent;
    overflow: hidden;
  }

  .cell::before {
    content: '';
    position: absolute; inset: 0;
    opacity: 0.15;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent 50%);
  }

  .cell-start { background: linear-gradient(135deg, hsl(145, 60%, 35%), hsl(145, 50%, 20%)); border-color: hsl(145, 70%, 50%); color: hsl(145, 80%, 80%); }
  .cell-end { background: linear-gradient(135deg, hsl(45, 80%, 45%), hsl(35, 70%, 25%)); border-color: hsl(45, 95%, 60%); color: hsl(45, 100%, 85%); }
  .cell-task { background: linear-gradient(135deg, hsl(230, 50%, 25%), hsl(250, 40%, 15%)); border-color: hsl(230, 60%, 45%); color: hsl(230, 70%, 80%); }
  .cell-event { background: linear-gradient(135deg, hsl(270, 60%, 30%), hsl(290, 45%, 18%)); border-color: hsl(270, 75%, 60%); color: hsl(270, 80%, 85%); }
  .cell-teleport { background: linear-gradient(135deg, hsl(175, 60%, 28%), hsl(190, 50%, 15%)); border-color: hsl(175, 80%, 50%); color: hsl(175, 85%, 80%); }
  .cell-shop { background: linear-gradient(135deg, hsl(40, 70%, 35%), hsl(30, 60%, 20%)); border-color: hsl(45, 90%, 55%); color: hsl(45, 100%, 80%); }

  .cell.active-path {
    animation: cellPulse 1.5s ease-in-out infinite;
  }

  @keyframes cellPulse {
    0%, 100% { box-shadow: 0 0 8px currentColor; }
    50% { box-shadow: 0 0 20px currentColor, 0 0 30px currentColor; }
  }

/* 棋子 */
.piece {
  position: absolute;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 900;
  pointer-events: none;
  will-change: left, top, transform;
  font-family: 'Orbitron', sans-serif;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}

  .piece-p1 {
    background: radial-gradient(circle at 30% 30%, hsl(210, 95%, 75%), hsl(210, 95%, 50%) 60%, hsl(210, 90%, 35%));
    box-shadow: 0 0 10px var(--p1-glow), 0 2px 6px rgba(0,0,0,0.5), inset -2px -2px 6px rgba(0,0,0,0.3);
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .piece-p2 {
    background: radial-gradient(circle at 30% 30%, hsl(340, 95%, 78%), hsl(340, 88%, 58%) 60%, hsl(340, 80%, 40%));
    box-shadow: 0 0 10px var(--p2-glow), 0 2px 6px rgba(0,0,0,0.5), inset -2px -2px 6px rgba(0,0,0,0.3);
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .piece.selectable {
    cursor: pointer;
    pointer-events: auto;
    outline: 2px solid hsl(60, 100%, 70%);
    outline-offset: 2px;
    animation: pieceFloat 1.2s ease-in-out infinite, pieceGlow 1.5s ease-in-out infinite;
  }

  .piece.selectable:hover {
    transform: translate(-50%, -50%) scale(1.25);
  }

  @keyframes pieceFloat {
    0%, 100% { transform: translate(-50%, calc(-50% - 3px)); }
    50% { transform: translate(-50%, calc(-50% + 3px)); }
  }
  @keyframes pieceGlow {
    0%, 100% {
      box-shadow: 0 0 8px hsl(60, 100%, 65%), 0 0 16px hsl(60, 100%, 55%), 0 2px 6px rgba(0,0,0,0.5);
    }
    50% {
      box-shadow: 0 0 14px hsl(60, 100%, 80%), 0 0 28px hsl(60, 100%, 65%), 0 2px 6px rgba(0,0,0,0.5);
    }
  }

  /* 3D 骰子 */
  .dice-scene {
    width: 100px;
    height: 100px;
    perspective: 600px;
    margin: 0 auto;
    position: relative;
  }

  .dice {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    opacity: 1;
    transition: transform 1.3s cubic-bezier(0.12, 0.82, 0.22, 1), opacity 0.2s ease;
    pointer-events: none;
  }

  .dice-scene.show-final .dice {
    opacity: 0;
    transition: transform 1.3s cubic-bezier(0.12, 0.82, 0.22, 1), opacity 0.2s ease;
  }

  .dice-final {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(145deg, hsl(240, 15%, 25%), hsl(240, 12%, 15%));
    border: 2px solid hsl(240, 20%, 40%);
    border-radius: 14px;
    padding: 14px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    justify-items: center;
    align-items: center;
    opacity: 0;
    transform: scale(0.92) translateZ(0);
    transition: opacity 0.25s ease-out 0.08s, transform 0.35s cubic-bezier(0.2, 1.4, 0.4, 1) 0.06s;
    pointer-events: none;
  }

  .dice-scene.show-final .dice-final {
    opacity: 1;
    transform: scale(1);
    transition: opacity 0.25s ease-out, transform 0.4s cubic-bezier(0.2, 1.3, 0.4, 1);
  }

  .dice-final .dot {
    background: radial-gradient(circle at 30% 30%, hsl(210, 95%, 75%), hsl(210, 95%, 55%));
    border-radius: 50%;
    box-shadow: 0 0 8px var(--p1-glow);
    width: 14px;
    height: 14px;
    display: block;
  }

  @keyframes diceRoll {
    0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
    100% { transform: rotateX(720deg) rotateY(1080deg) rotateZ(360deg); }
  }

  .dice-face {
    position: absolute;
    width: 100px;
    height: 100px;
    background: linear-gradient(145deg, hsl(240, 15%, 25%), hsl(240, 12%, 15%));
    border: 2px solid hsl(240, 20%, 40%);
    border-radius: 14px;
    padding: 14px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
    display: grid !important;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    justify-items: center;
    align-items: center;
  }

  .dice-face .dot {
    background: radial-gradient(circle at 30% 30%, hsl(210, 95%, 75%), hsl(210, 95%, 55%));
    border-radius: 50%;
    box-shadow: 0 0 8px var(--p1-glow);
    width: 14px;
    height: 14px;
    display: block;
  }

  /* 1点：正中央 */
  .face-1 .dot { grid-area: 2 / 2; }

  /* 2点：左上 + 右下 */
  .face-2 .dot:nth-child(1) { grid-area: 1 / 1; }
  .face-2 .dot:nth-child(2) { grid-area: 3 / 3; }

  /* 3点：左上 + 正中 + 右下 */
  .face-3 .dot:nth-child(1) { grid-area: 1 / 1; }
  .face-3 .dot:nth-child(2) { grid-area: 2 / 2; }
  .face-3 .dot:nth-child(3) { grid-area: 3 / 3; }

  /* 4点：四角 */
  .face-4 .dot:nth-child(1) { grid-area: 1 / 1; }
  .face-4 .dot:nth-child(2) { grid-area: 1 / 3; }
  .face-4 .dot:nth-child(3) { grid-area: 3 / 1; }
  .face-4 .dot:nth-child(4) { grid-area: 3 / 3; }

  /* 5点：四角 + 正中 */
  .face-5 .dot:nth-child(1) { grid-area: 1 / 1; }
  .face-5 .dot:nth-child(2) { grid-area: 1 / 3; }
  .face-5 .dot:nth-child(3) { grid-area: 2 / 2; }
  .face-5 .dot:nth-child(4) { grid-area: 3 / 1; }
  .face-5 .dot:nth-child(5) { grid-area: 3 / 3; }

  /* 6点：左列3个 + 右列3个 */
  .face-6 .dot:nth-child(1) { grid-area: 1 / 1; }
  .face-6 .dot:nth-child(2) { grid-area: 2 / 1; }
  .face-6 .dot:nth-child(3) { grid-area: 3 / 1; }
  .face-6 .dot:nth-child(4) { grid-area: 1 / 3; }
  .face-6 .dot:nth-child(5) { grid-area: 2 / 3; }
  .face-6 .dot:nth-child(6) { grid-area: 3 / 3; }

  .face-front  { transform: rotateY(   0deg) translateZ(50px); }
  .face-back   { transform: rotateY( 180deg) translateZ(50px); }
  .face-right  { transform: rotateY(  90deg) translateZ(50px); }
  .face-left   { transform: rotateY( -90deg) translateZ(50px); }
  .face-top    { transform: rotateX( -90deg) translateZ(50px); }
  .face-bottom { transform: rotateX(  90deg) translateZ(50px); }

  /* 骰子可掷骰高亮动效 */
  .dice-scene.dice-ready {
    animation: diceReadyBounce 2s ease-in-out infinite, diceReadyGlow 1.8s ease-in-out infinite;
    cursor: pointer;
  }
  .dice-scene.dice-not-ready {
    opacity: 0.45;
    cursor: not-allowed;
    filter: grayscale(0.5);
  }

  @keyframes diceReadyBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes diceReadyGlow {
    0%, 100% { filter: drop-shadow(0 0 6px hsl(210, 95%, 65%)); }
    50% { filter: drop-shadow(0 0 14px hsl(210, 95%, 75%)); }
  }

  /* 抽卡动效 */
  .card-reveal {
    animation: cardReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes cardReveal {
    0% { transform: scale(0.3) rotateY(180deg); opacity: 0; }
    50% { transform: scale(1.1) rotateY(90deg); opacity: 1; }
    100% { transform: scale(1) rotateY(0deg); opacity: 1; }
  }

  .card-flip {
    animation: cardFlip 0.6s ease-in-out;
  }

  @keyframes cardFlip {
    0% { transform: rotateY(0); }
    50% { transform: rotateY(90deg); }
    100% { transform: rotateY(0); }
  }

  .card-shine {
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shine 2s ease-in-out infinite;
  }

  @keyframes shine {
    0% { left: -100%; }
    50%, 100% { left: 100%; }
  }

  /* 粒子效果 */
  .particle-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
  }

  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
  }

  /* 模态框动画 */
  .modal-enter {
    animation: modalEnter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modalEnter {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .slide-up { animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* 按钮 */
  .btn {
    padding: 10px 24px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
    font-size: 14px;
  }

  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-primary {
    background: linear-gradient(135deg, hsl(210, 90%, 50%), hsl(230, 85%, 45%));
    color: white;
    box-shadow: 0 4px 20px hsla(210, 90%, 50%, 0.4);
  }
  .btn-primary:hover { box-shadow: 0 6px 28px hsla(210, 90%, 55%, 0.6); }

  .btn-p2 {
    background: linear-gradient(135deg, hsl(340, 85%, 55%), hsl(320, 80%, 50%));
    color: white;
    box-shadow: 0 4px 20px hsla(340, 85%, 55%, 0.4);
  }

  .btn-gold {
    background: linear-gradient(135deg, hsl(45, 90%, 55%), hsl(30, 90%, 45%));
    color: hsl(30, 40%, 10%);
    box-shadow: 0 4px 20px hsla(45, 90%, 55%, 0.4);
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-ghost:hover { background: var(--surface-2); }

  /* 装备槽 */
  .equip-slot {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.2s ease;
    position: relative;
  }
  .equip-slot.off {
    opacity: 0.35;
    filter: grayscale(0.8);
  }
  .equip-slot.off::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 45%, rgba(239, 68, 68, 0.7) 50%, transparent 55%);
    border-radius: 6px;
  }

  .inventory-slot {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    background: rgba(250, 204, 21, 0.1);
    border: 1px solid rgba(250, 204, 21, 0.3);
    position: relative;
    cursor: help;
    transition: all 0.2s;
  }
  .inventory-slot:hover {
    background: rgba(250, 204, 21, 0.2);
    transform: scale(1.1);
  }
  .inventory-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--gold);
    color: #000;
    font-size: 9px;
    font-weight: bold;
