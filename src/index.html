<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星空飞行棋 · 双人对战</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { overflow-wrap: break-word; margin: 0; }

  :root {
    --bg: hsl(240, 18%, 6%);
    --bg-2: hsl(240, 15%, 10%);
    --surface: hsl(240, 12%, 14%);
    --surface-2: hsl(240, 10%, 18%);
    --border: hsl(240, 10%, 24%);
    --text: hsl(240, 20%, 95%);
    --text-muted: hsl(240, 10%, 60%);
    --p1: hsl(210, 95%, 60%);
    --p1-glow: hsla(210, 95%, 60%, 0.6);
    --p2: hsl(340, 88%, 62%);
    --p2-glow: hsla(340, 88%, 62%, 0.6);
    --gold: hsl(45, 95%, 60%);
    --green: hsl(145, 70%, 50%);
  }

  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, hsla(210, 80%, 30%, 0.25), transparent 50%),
      radial-gradient(ellipse at 80% 80%, hsla(340, 70%, 25%, 0.2), transparent 50%),
      radial-gradient(ellipse at 50% 50%, hsla(270, 60%, 20%, 0.15), transparent 70%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 25% 30%, white, transparent),
      radial-gradient(1px 1px at 75% 60%, white, transparent),
      radial-gradient(1.5px 1.5px at 50% 15%, hsla(210, 90%, 80%, 0.9), transparent),
      radial-gradient(1px 1px at 10% 70%, white, transparent),
      radial-gradient(1px 1px at 90% 40%, hsla(340, 90%, 80%, 0.8), transparent),
      radial-gradient(1.5px 1.5px at 60% 85%, white, transparent),
      radial-gradient(1px 1px at 35% 50%, hsla(270, 80%, 80%, 0.7), transparent),
      radial-gradient(1px 1px at 85% 10%, white, transparent);
    opacity: 0.4; pointer-events: none; z-index: 0;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.3; } to { opacity: 0.6; } }

  .font-display { font-family: 'Orbitron', sans-serif; }

  .glass {
    background: linear-gradient(135deg, hsla(240, 15%, 16%, 0.85), hsla(240, 12%, 10%, 0.92));
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* 棋盘格子 */
  .cell {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    transition: all 0.2s;
    border: 1px solid transparent;
    overflow: visible;
  }
  .cell::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 10px;
    opacity: 0.15;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent 50%);
  }
  .cell-start { background: linear-gradient(135deg, hsl(145, 60%, 35%), hsl(145, 50%, 20%)); border-color: hsl(145, 70%, 50%); color: hsl(145, 80%, 80%); }
  .cell-end { background: linear-gradient(135deg, hsl(45, 80%, 45%), hsl(35, 70%, 25%)); border-color: hsl(45, 95%, 60%); color: hsl(45, 100%, 85%); }
  .cell-task { background: linear-gradient(135deg, hsl(230, 50%, 25%), hsl(250, 40%, 15%)); border-color: hsl(230, 60%, 45%); color: hsl(230, 70%, 80%); }
  .cell-event { background: linear-gradient(135deg, hsl(270, 60%, 30%), hsl(290, 45%, 18%)); border-color: hsl(270, 75%, 60%); color: hsl(270, 80%, 85%); }
  .cell-teleport { background: linear-gradient(135deg, hsl(175, 60%, 28%), hsl(190, 50%, 15%)); border-color: hsl(175, 80%, 50%); color: hsl(175, 85%, 80%); }
  .cell-shop { background: linear-gradient(135deg, hsl(40, 70%, 35%), hsl(30, 60%, 20%)); border-color: hsl(45, 90%, 55%); color: hsl(45, 100%, 80%); }

  .cell-index {
    position: absolute;
    top: 2px; left: 4px;
    font-size: 8px;
    opacity: 0.3;
    font-family: 'Orbitron', sans-serif;
    pointer-events: none;
  }

  /* 棋子 */
  .piece {
    position: absolute;
    width: 26px; height: 26px;
    border-radius: 50%;
    transition: left 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.15s ease, opacity 0.3s;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    pointer-events: none;
    will-change: left, top;
    font-family: 'Orbitron', sans-serif;
    transform: translate(-50%, -50%);
  }
  .piece-p1 {
    background: radial-gradient(circle at 30% 30%, hsl(210, 95%, 75%), hsl(210, 95%, 50%) 60%, hsl(210, 90%, 35%));
    box-shadow: 0 0 10px var(--p1-glow), 0 2px 6px rgba(0,0,0,0.5), inset -2px -2px 6px rgba(0,0,0,0.3);
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .piece-p2 {
    background: radial-gradient(circle at 30% 30%, hsl(340, 95%, 78%), hsl(340, 88%, 58%) 60%, hsl(340, 80%, 40%));
    box-shadow: 0 0 10px var(--p2-glow), 0 2px 6px rgba(0,0,0,0.5), inset -2px -2px 6px rgba(0,0,0,0.3);
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .piece.selectable {
    cursor: pointer;
    pointer-events: auto;
    animation: pieceFloat 1s ease-in-out infinite;
    z-index: 20;
  }
  @keyframes pieceFloat {
    0%, 100% { transform: translate(-50%, calc(-50% - 4px)); }
    50% { transform: translate(-50%, calc(-50% + 4px)); }
  }
  .piece.piece-finished {
    opacity: 0.3;
    filter: grayscale(0.5);
  }

  /* 3D 骰子 */
  .dice-scene {
    width: 90px; height: 90px;
    perspective: 600px;
    margin: 0 auto;
    position: relative;
    cursor: pointer;
  }
  .dice-scene.rolling { pointer-events: none; }
  .dice-scene.can-roll:hover .dice-final {
    box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 0 20px var(--p1-glow);
  }
  .dice {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1.3s cubic-bezier(0.12, 0.82, 0.22, 1);
    pointer-events: none;
  }
  .dice-scene.show-final .dice { opacity: 0; transition: opacity 0.2s ease; }
  .dice-final {
    position: absolute; inset: 0;
    background: linear-gradient(145deg, hsl(240, 15%, 25%), hsl(240, 12%, 15%));
    border: 2px solid hsl(240, 20%, 40%);
    border-radius: 14px;
    padding: 12px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    justify-items: center;
    align-items: center;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.25s ease-out, transform 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
    pointer-events: none;
  }
  .dice-scene.show-final .dice-final {
    opacity: 1;
    transform: scale(1);
  }
  .dice-final .dot, .dice-face .dot {
    background: radial-gradient(circle at 30% 30%, hsl(210, 95%, 75%), hsl(210, 95%, 55%));
    border-radius: 50%;
    box-shadow: 0 0 8px var(--p1-glow);
    width: 13px; height: 13px;
    display: block;
  }
  .dice-face {
    position: absolute;
    width: 90px; height: 90px;
    background: linear-gradient(145deg, hsl(240, 15%, 25%), hsl(240, 12%, 15%));
    border: 2px solid hsl(240, 20%, 40%);
    border-radius: 14px;
    padding: 12px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
    display: grid !important;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    justify-items: center;
    align-items: center;
  }
  .face-1 .dot { grid-area: 2 / 2; }
  .face-2 .dot:nth-child(1) { grid-area: 1 / 1; }
  .face-2 .dot:nth-child(2) { grid-area: 3 / 3; }
  .face-3 .dot:nth-child(1) { grid-area: 1 / 1; }
  .face-3 .dot:nth-child(2) { grid-area: 2 / 2; }
  .face-3 .dot:nth-child(3) { grid-area: 3 / 3; }
  .face-4 .dot:nth-child(1) { grid-area: 1 / 1; }
  .face-4 .dot:nth-child(2) { grid-area: 1 / 3; }
  .face-4 .dot:nth-child(3) { grid-area: 3 / 1; }
  .face-4 .dot:nth-child(4) { grid-area: 3 / 3; }
  .face-5 .dot:nth-child(1) { grid-area: 1 / 1; }
  .face-5 .dot:nth-child(2) { grid-area: 1 / 3; }
  .face-5 .dot:nth-child(3) { grid-area: 2 / 2; }
  .face-5 .dot:nth-child(4) { grid-area: 3 / 1; }
  .face-5 .dot:nth-child(5) { grid-area: 3 / 3; }
  .face-6 .dot:nth-child(1) { grid-area: 1 / 1; }
  .face-6 .dot:nth-child(2) { grid-area: 1 / 3; }
  .face-6 .dot:nth-child(3) { grid-area: 2 / 1; }
  .face-6 .dot:nth-child(4) { grid-area: 2 / 3; }
  .face-6 .dot:nth-child(5) { grid-area: 3 / 1; }
  .face-6 .dot:nth-child(6) { grid-area: 3 / 3; }

  .dice-face.front  { transform: translateZ(45px); }
  .dice-face.back   { transform: rotateY(180deg) translateZ(45px); }
  .dice-face.right  { transform: rotateY(90deg)  translateZ(45px); }
  .dice-face.left   { transform: rotateY(-90deg) translateZ(45px); }
  .dice-face.top    { transform: rotateX(90deg)  translateZ(45px); }
  .dice-face.bottom { transform: rotateX(-90deg) translateZ(45px); }

  /* 按钮 */
  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600; font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, hsl(210, 95%, 55%), hsl(230, 85%, 50%));
    color: white;
    box-shadow: 0 4px 12px hsla(210, 95%, 55%, 0.4);
  }
  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border-color: var(--border);
  }
  .btn-gold {
    background: linear-gradient(135deg, hsl(45, 95%, 55%), hsl(35, 90%, 45%));
    color: hsl(30, 50%, 10%);
    box-shadow: 0 4px 12px hsla(45, 95%, 55%, 0.4);
  }
  .btn-danger {
    background: linear-gradient(135deg, hsl(340, 88%, 58%), hsl(350, 80%, 48%));
    color: white;
  }

  /* 装备槽 */
  .equip-slot {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all 0.3s;
  }
  .equip-slot.on {
    background: linear-gradient(135deg, hsl(145, 60%, 30%), hsl(145, 50%, 20%));
    border: 1px solid hsl(145, 70%, 50%);
    box-shadow: 0 0 8px hsla(145, 70%, 50%, 0.4);
  }
  .equip-slot.off {
    background: hsl(240, 10%, 12%);
    border: 1px dashed hsl(240, 10%, 30%);
    opacity: 0.35;
    filter: grayscale(1);
  }

  /* 道具栏 */
  .inv-item {
    width: 28px; height: 28px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    position: relative;
    cursor: help;
  }
  .inv-item .charges {
    position: absolute;
    top: -4px; right: -4px;
    width: 14px; height: 14px;
    background: var(--gold);
    color: black;
    font-size: 9px;
    font-weight: 900;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  /* 弹窗动画 */
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-enter { animation: modalIn 0.3s cubic-bezier(0.2, 1.4, 0.4, 1); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .fade-in { animation: fadeIn 0.3s ease; }

  /* 任务卡片抽卡动效 */
  @keyframes cardReveal {
    0% { opacity: 0; transform: rotateY(90deg) scale(0.8); }
    100% { opacity: 1; transform: rotateY(0) scale(1); }
  }
  .card-reveal { animation: cardReveal 0.4s cubic-bezier(0.2, 1.4, 0.4, 1) both; }

  /* 粒子 */
  .particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
  }

  /* 分数弹出 */
  .score-popup {
    position: absolute;
    font-weight: 900;
    font-size: 18px;
    font-family: 'Orbitron', sans-serif;
    pointer-events: none;
    z-index: 30;
    animation: scorePop 1.2s ease-out forwards;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  @keyframes scorePop {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    30% { opacity: 1; transform: translateY(-10px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-40px) scale(1); }
  }

  /* 商店物品 */
  .shop-item {
    padding: 12px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    transition: all 0.2s;
    cursor: pointer;
  }
  .shop-item:hover:not(.owned):not(.purchased) {
    border-color: hsl(45, 90%, 55%);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px hsla(45, 90%, 55%, 0.2);
  }
  .shop-item.owned, .shop-item.purchased { opacity: 0.4; cursor: default; }

  /* 输入框 */
  .input {
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
    width: 100%;
  }
  .input:focus {
    border-color: hsl(210, 95%, 60%);
    box-shadow: 0 0 0 3px hsla(210, 95%, 60%, 0.2);
  }
  .input::placeholder { color: var(--text-muted); }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .text-gradient-p1 {
    background: linear-gradient(135deg, hsl(210, 95%, 70%), hsl(230, 85%, 65%));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .text-gradient-p2 {
    background: linear-gradient(135deg, hsl(340, 95%, 75%), hsl(320, 85%, 65%));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  /* 胜利画面 */
  .victory-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .victory-title {
    font-size: 42px; font-weight: 900;
    font-family: 'Orbitron', sans-serif;
    animation: victoryBounce 0.6s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  @keyframes victoryBounce {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 移动端 */
  @media (max-width: 640px) {
    .cell { border-radius: 6px; }
    .piece { width: 22px; height: 22px; font-size: 9px; }
    .dice-scene { width: 70px; height: 70px; }
    .dice-face { width: 70px; height: 70px; padding: 10px; }
    .dice-face.front  { transform: translateZ(35px); }
    .dice-face.back   { transform: rotateY(180deg) translateZ(35px); }
    .dice-face.right  { transform: rotateY(90deg)  translateZ(35px); }
    .dice-face.left   { transform: rotateY(-90deg) translateZ(35px); }
    .dice-face.top    { transform: rotateX(90deg)  translateZ(35px); }
    .dice-face.bottom { transform: rotateX(-90deg) translateZ(35px); }
    .dice-face .dot, .dice-final .dot { width: 10px; height: 10px; }
    .dice-final { padding: 10px; }
    .equip-slot { width: 28px; height: 28px; font-size: 14px; }
    .victory-title { font-size: 30px; }
  }
</style>
</head>
<body class="relative">
<div id="app" class="relative z-10 min-h-screen flex flex-col">

  <!-- 首页 -->
  <div id="homeView" class="flex-1 flex items-center justify-center px-4 py-6">
    <div class="glass rounded-2xl p-6 md:p-8 w-full max-w-md">
      <div class="text-center mb-6">
        <div class="text-5xl mb-3">🎲</div>
        <h1 class="font-display text-2xl md:text-3xl font-black tracking-wider mb-1">
          <span class="text-gradient-p1">星空</span><span class="text-gradient-p2">飞行棋</span>
        </h1>
        <p class="text-sm text-gray-400">双人对战 · 30+随机事件 · 装备系统</p>
      </div>
      <div class="space-y-3">
        <button id="modeLocal" class="btn btn-primary w-full py-3 text-base">🎮 本地双人对战</button>
        <button id="modeCreate" class="btn btn-secondary w-full py-3 text-base">🌐 创建联机房间</button>
        <button id="modeJoin" class="btn btn-secondary w-full py-3 text-base">🔗 加入房间</button>
      </div>
    </div>
  </div>

  <!-- 配置页 -->
  <div id="configView" class="hidden flex-1 flex items-center justify-center px-4 py-6">
    <div class="glass rounded-2xl p-6 w-full max-w-lg">
      <h2 class="font-display text-xl font-bold text-center mb-4">游戏配置</h2>
      <p class="text-sm text-gray-400 mb-2">任务列表（每行一个，格式：任务描述|积分奖励）</p>
      <textarea id="taskConfig" class="input font-mono text-sm" rows="10" placeholder="任务描述|奖励积分"></textarea>
      <div class="flex gap-2 mt-3">
        <button id="addDefaultTasks" class="btn btn-secondary flex-1 text-sm">填充默认任务</button>
        <button id="clearTasks" class="btn btn-secondary flex-1 text-sm">清空</button>
      </div>
      <button id="startGame" class="btn btn-primary w-full py-3 mt-4 text-base">开始游戏</button>
    </div>
  </div>

  <!-- 联机大厅 -->
  <div id="lobbyView" class="hidden flex-1 flex items-center justify-center px-4 py-6">
    <div class="glass rounded-2xl p-6 w-full max-w-md text-center">
      <h2 id="lobbyTitle" class="font-display text-xl font-bold mb-2">房间</h2>
      <p id="lobbySubtitle" class="text-sm text-gray-400 mb-4"></p>
      <div class="bg-gray-900/50 rounded-xl p-4 mb-4">
        <p class="text-xs text-gray-500 mb-1">房间号</p>
        <p id="roomIdDisplay" class="font-display text-4xl font-black text-yellow-400 tracking-widest"></p>
      </div>
      <div class="flex justify-between text-sm mb-4">
        <span id="lobbyP1Name" class="text-blue-400">玩家1</span>
        <span id="lobbyP2Name" class="text-pink-400">等待中...</span>
      </div>
      <p id="lobbyStatus" class="text-xs text-gray-500 mb-4"></p>
      <div class="flex gap-2">
        <button id="copyRoomId" class="btn btn-secondary flex-1">复制房间号</button>
        <button id="leaveRoomBtn" class="btn btn-danger">离开</button>
      </div>
    </div>
  </div>

  <!-- 游戏界面 -->
  <div id="gameView" class="hidden flex-1 flex flex-col">
    <!-- 顶部玩家信息 -->
    <div class="px-3 md:px-6 py-2 flex items-center justify-between gap-2">
      <div id="p2Info" class="flex items-center gap-2 flex-1 min-w-0 p-2 rounded-xl border border-transparent transition-all">
        <div class="w-10 h-10 rounded-full flex items-center justify-center font-display font-black text-sm piece-p2 flex-shrink-0">P2</div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm">玩家2</span>
            <span id="p2Score" class="text-yellow-400 font-display font-bold">15</span>
          </div>
          <div class="flex gap-1 mt-1 items-center">
            <div id="p2Equipment" class="flex gap-1"></div>
            <div id="p2Inventory" class="flex gap-1 ml-1"></div>
          </div>
        </div>
      </div>
      <div class="text-center flex-shrink-0 px-2">

const ITEM_DEFS = {
  cheatDice:{name:'作弊骰子',icon:'🎲',price:6,desc:'2次掷骰必为6',charges:2},

  thornArmor:{name:'荆棘甲',icon:'🌵',price:10,desc:'被踢时对方失一件',charges:1},
  immovable:{name:'不动甲',icon:'🗿',price:18,desc:'被踢时反踢对方',charges:1},
  springArmor:{name:'弹簧甲',icon:'🌀',price:6,desc:'叠棋时直接上一层',charges:1},
  teleportTrap:{name:'传送陷阱',icon:'🕳️',price:18,desc:'对方传送改为向下',charges:1},
  financeTrap:{name:'金融陷阱',icon:'⚠️',price:16,desc:'对方事件格-18分或失装备',charges:1},
  gripGlove:{name:'防滑手套',icon:'🧤',price:10,desc:'免疫一次跌落/失装备',charges:1},
  thiefGlove:{name:'窃贼手套',icon:'🧤',price:9,desc:'对方脱装时获得该装备',charges:1}
};

const DEFAULT_TASKS_RAW = `大声唱一首歌|3
模仿一种动物叫声|2
说一个笑话|4
夸对方一句|3
原地转三圈|2
做一个鬼脸|2
学猫叫三声|1
模仿班主任说话|4
摆一个最酷的pose|2
做十个俯卧撑|5
用屁股写自己的名字|6
学一段广告台词|6
表演一个才艺|8
做二十个深蹲|7
学一首新歌副歌|5
即兴rap一分钟|7
模仿最讨厌的明星|5
一口气喝完整杯水|8`;

// ============================================================
//  游戏引擎（与服务端一致）
// ============================================================
class GameEngine {
  constructor(taskList) {
    this.tasks = taskList || parseTasks(DEFAULT_TASKS_RAW);
    this.lowTierTasks = this.tasks.filter(t => t.reward <= 4);
    this.highTierTasks = this.tasks.filter(t => t.reward >= 5);
    this.lowTierDeck = shuffle([...this.lowTierTasks]);
    this.highTierDeck = shuffle([...this.highTierTasks]);
    this.eventDeck = shuffle([...EVENTS]);
    this.listeners = {};
    this.currentTasks = [];
    this.shopItems = [];
    this.pendingCellResolve = null;
    this.state = this._initialState();
  }

  _initialState() {
    const mkEq = () => ([
      { id:'top', name:'上衣', icon:'👕', on:true },
      { id:'pants', name:'裤子', icon:'👖', on:true },
      { id:'bra', name:'内衣（特殊）', icon:'🎀', on:true },
      { id:'briefs', name:'内裤', icon:'🩲', on:true }
    ]);
    return {
      currentPlayer:0, phase:'idle', diceValue:0, diceBonus:0, rerollCount:0,
      players:[
        { score:15, pieces:[0,0], finished:[false,false], equipment:mkEq(), skipClothesStreak:0, allDone:false, inventory:{} },
        { score:15, pieces:[0,0], finished:[false,false], equipment:mkEq(), skipClothesStreak:0, allDone:false, inventory:{} }
      ],
      winner:null, endgame:false, extraTurn:null, autoMovePending:false, autoMoveSkipClothes:false
    };
  }

  on(e, cb) { (this.listeners[e] = this.listeners[e] || []).push(cb); }
  emit(e, d) { (this.listeners[e] || []).forEach(cb => cb(d)); }

  posToRC(pos) {
    const r = Math.floor(pos/8), c = pos%8;
    return { row:r, col: r%2===0 ? c : (7-c) };
  }
  rcToPos(r, c) { return r*8 + (r%2===0 ? c : (7-c)); }
  getRow(p) { return Math.floor(p/8); }
  colAbove(p) { const {row,col} = this.posToRC(p); return row>=4 ? null : this.rcToPos(row+1,col); }
  colBelow(p) { const {row,col} = this.posToRC(p); return row<=0 ? 0 : this.rcToPos(row-1,col); }

  drawLow() { if(!this.lowTierDeck.length) this.lowTierDeck=shuffle([...this.lowTierTasks]); return this.lowTierDeck.pop(); }
  drawHigh() { if(!this.highTierDeck.length) this.highTierDeck=shuffle([...this.highTierTasks]); return this.highTierDeck.pop(); }
  drawEvent() { if(!this.eventDeck.length) this.eventDeck=shuffle([...EVENTS]); return this.eventDeck.pop(); }

  hasItem(p,id) { return this.state.players[p].inventory[id] > 0; }
  addItem(p,id) { const d=ITEM_DEFS[id]; if(!d||this.state.players[p].inventory[id]) return false; this.state.players[p].inventory[id]=d.charges||1; this.emit('inventoryChange',{player:p,itemId:id}); return true; }
  useItem(p,id) { const pl=this.state.players[p]; if(!pl.inventory[id]) return false; pl.inventory[id]--; if(pl.inventory[id]<=0) delete pl.inventory[id]; this.emit('inventoryChange',{player:p,itemId:id}); return true; }
  equipCount(p) { return this.state.players[p].equipment.filter(e=>e.on).length; }

  loseRandomEquip(p, opts={}) {
    const pl = this.state.players[p];
    const on = pl.equipment.filter(e=>e.on);
    if(!on.length) return null;
    if(opts.fromEvent && this.hasItem(p,'gripGlove')) { this.useItem(p,'gripGlove'); this.emit('itemEffect',{player:p,itemId:'gripGlove',detail:'免疫失装备'}); return null; }
    const t = on[Math.floor(Math.random()*on.length)];
    t.on = false; pl.skipClothesStreak = 0;
    this.emit('equipmentChange',{player:p});
    if(this.hasItem(p,'financeIns')) { this.useItem(p,'financeIns'); pl.score+=20; this.emit('scoreChange',{player:p,delta:20,score:pl.score}); }
    if(pl.equipment.filter(e=>e.on).length===0 && this.hasItem(p,'emergencyIns')) { this.useItem(p,'emergencyIns'); this.restoreRandomEquip(p); }
    return t.id;
  }
  restoreRandomEquip(p) {
    const off = this.state.players[p].equipment.filter(e=>!e.on);
    if(!off.length) return null;
    const t = off[Math.floor(Math.random()*off.length)];
    t.on = true; this.emit('equipmentChange',{player:p}); return t.id;
  }
  getSkipPrice(p) { return 10 + (this.state.players[p].skipClothesStreak||0)*5; }

  rollDice() {
    if(this.state.phase!=='idle') return;
    const p = this.state.players[this.state.currentPlayer];
    if(p.allDone) { this.endTurn(); return; }
    this.state.phase='rolling';
    this._doRoll();
    this.emit('diceRoll',{value:this.state.diceValue});
    this.emit('stateChange',this.state);
  }
  rerollDice() {
    if(this.state.phase!=='selecting') return;
    const p = this.state.players[this.state.currentPlayer];
    const cost = (this.state.rerollCount+1)*2;
    if(p.score<cost) return;
    p.score-=cost; this.state.rerollCount++;
    this.emit('scoreChange',{player:this.state.currentPlayer,delta:-cost,score:p.score});
    this.state.phase='rolling';
    this._doRoll();
    this.emit('diceRoll',{value:this.state.diceValue});
    this.emit('stateChange',this.state);
  }
  _doRoll() {
    const cur = this.state.currentPlayer, en = 1-cur;
    let v = Math.floor(Math.random()*6)+1, bonus=0, pen=0;
    if(this.hasItem(cur,'cheatDice')) { v=6; this.useItem(cur,'cheatDice'); this.emit('itemEffect',{player:cur,itemId:'cheatDice',detail:'必出6'}); }
    if(this.hasItem(cur,'luckyDice')) { bonus+=2; this.useItem(cur,'luckyDice'); }
    if(this.hasItem(en,'curseDice')) { pen=1+Math.floor(Math.random()*2); this.useItem(en,'curseDice'); }
    this.state.diceValue=v; this.state.diceBonus=bonus-pen;
    if(this.hasItem(cur,'autoDice')) { this.useItem(cur,'autoDice'); this.state.autoMovePending=true; }
  }
  onDiceAnimEnd() {
    this.state.phase='selecting';
    const p = this.state.players[this.state.currentPlayer];
    this.emit('selectPiece',this.state.diceValue);
    this.emit('showRerollChoice',{diceValue:this.state.diceValue,rerollCost:(this.state.rerollCount+1)*2,canAfford:p.score>=(this.state.rerollCount+1)*2});
    this.emit('stateChange',this.state);
  }
  movePiece(idx) {
    if(this.state.phase!=='selecting') return;
    const p = this.state.players[this.state.currentPlayer];
    if(p.finished[idx]) return;
    this.state.phase='moving';
    const from=p.pieces[idx], steps=Math.max(1,this.state.diceValue+(this.state.diceBonus||0)), to=Math.min(from+steps,39);
    if(this.state.autoMovePending) { this.state.autoMoveSkipClothes=true; this.state.autoMovePending=false; }
    this.emit('pieceMove',{player:this.state.currentPlayer,pieceIndex:idx,fromPos:from,toPos:to});
  }

  onMoveComplete(player, idx, from, to) {
    const p = this.state.players[player];
    p.pieces[idx]=to;
    if(to>=39) {
      p.finished[idx]=true;
      this.emit('pieceFinished',{player,pieceIndex:idx});
      if(p.finished.every(f=>f)) {
        p.allDone=true;
        this.state.endgame=this.state.players.some(x=>!x.allDone);
        if(this.state.players.every(x=>x.allDone)) {
          this.state.phase='over';
          const s0=this.state.players[0].score, s1=this.state.players[1].score;
          this.state.winner = s0>s1?0:s1>s0?1:-1;
          this.emit('victory',{winner:this.state.winner,score0:s0,score1:s1});
          this.emit('stateChange',this.state); return;
        }
      }
      this.endTurn(); return;
    }
    const fromRow=this.posToRC(from).row, toRow=this.posToRC(to).row;
    const onClothes=p.equipment.filter(e=>e.on).length;
    if(from!==to && toRow>fromRow && onClothes>0) {
      if(this.state.autoMoveSkipClothes) { this.state.autoMoveSkipClothes=false; this._resolveCol(player,idx,to); return; }
      if(this.hasItem(player,'freeClothes')) { this.useItem(player,'freeClothes'); p.skipClothesStreak=0; this._resolveCol(player,idx,to); return; }
      this.state.phase='clothesChoice';
      this.emit('showClothesChoice',{player,pieceIndex:idx,pos:to,price:this.getSkipPrice(player),canAfford:p.score>=this.getSkipPrice(player)});
      return;
    }
    this._resolveCol(player,idx,to);
  }
  _resolveCol(pl,idx,pos) {
    this.state.phase='resolving';
    this.checkCollision(pl,idx,pos,skip=>{ if(!skip) this._resolveCell(pl,idx,pos); });
  }
  _resolveCell(pl,idx,pos) {
    switch(CELL_TYPES[pos]) {
      case 'task':
        this.currentTasks=[this.drawLow(),this.drawHigh()].filter(Boolean);
        this.emit('showTask',{player:pl,tasks:this.currentTasks});
        this.pendingCellResolve={player:pl,pieceIndex:idx,pos,afterResolve:()=>this.endTurn()};
        break;
      case 'event':
        const ev=this.drawEvent();
        this.emit('showEvent',{player:pl,event:ev});
        this.pendingCellResolve={player:pl,pieceIndex:idx,pos,afterResolve:()=>{
          this.state.phase='resolving';
          this._triggerEvent(ev,{player:pl,pieceIndex:idx,pos,onDone:()=>this.endTurn()});
        }};
        break;
      case 'teleport': this._doTeleport(pl,idx,pos); break;
      case 'shop':
        this.openShop(pl);
        this.pendingCellResolve={player:pl,pieceIndex:idx,pos,afterResolve:()=>this.endTurn()};
        break;
      default: this.endTurn();
    }
  }

  takeOffEquip(pl,idx,pos,eIdx) {
    const p=this.state.players[pl];
    if(!p.equipment[eIdx]?.on) return;
    const eid=p.equipment[eIdx].id;
    p.equipment[eIdx].on=false; p.skipClothesStreak=0;
    const en=1-pl;
    if(this.hasItem(en,'thiefGlove')) {
      const eq=this.state.players[en].equipment.find(e=>e.id===eid);
      if(eq&&!eq.on) { eq.on=true; this.useItem(en,'thiefGlove'); this.emit('itemEffect',{player:en,itemId:'thiefGlove',detail:'偷到装备'}); }
    }
    this.emit('equipmentChange',{player:pl});
    this.emit('hideClothesChoice');
    this._resolveCol(pl,idx,pos);
  }
  buySkip(pl,idx,pos) {
    const p=this.state.players[pl], price=this.getSkipPrice(pl);
    if(p.score<price) return;
    p.score-=price; p.skipClothesStreak=(p.skipClothesStreak||0)+1;
    this.emit('scoreChange',{player:pl,delta:-price,score:p.score});
    this.emit('hideClothesChoice');
    this._resolveCol(pl,idx,pos);
  }

  selectTask(tIdx) {
    const task=this.currentTasks[tIdx];
    if(!task) return;
    const cur=this.state.currentPlayer, p=this.state.players[cur], en=1-cur;
    const bonus=p.equipment.filter(e=>!e.on).length*2;
    let total=task.reward+bonus;
    if(this.hasItem(cur,'freeCard')&&this.currentTasks.length>=2) {
      this.useItem(cur,'freeCard');
      total += this.currentTasks[1-tIdx].reward + bonus;
    }
    if(this.hasItem(cur,'doubleScore')) { this.useItem(cur,'doubleScore'); total*=2; }
    let rp=cur;
    if(this.hasItem(en,'switchCard')) { this.useItem(en,'switchCard'); rp=en; }
    this.state.players[rp].score+=total;
    this.emit('scoreChange',{player:rp,delta:total,score:this.state.players[rp].score});
    this.emit('hideTask');
    this._finishResolve();
  }
  closeEvent() { this.emit('hideEvent'); this._finishResolve(); }
  _finishResolve() { if(this.pendingCellResolve) { const r=this.pendingCellResolve; this.pendingCellResolve=null; r.afterResolve(); } }

  _doTeleport(pl,idx,pos) {
    const {row,col}=this.posToRC(pos), en=1-pl;
    let dir=1;
    if(this.hasItem(en,'teleportTrap')) { this.useItem(en,'teleportTrap'); dir=-1; }
    const nr=row+dir;
    if(nr>4||nr<0) { this._resolveCol(pl,idx,pos); return; }
    const np=this.rcToPos(nr,col);
    this.state.players[pl].pieces[idx]=np;
    this.emit('teleport',{player:pl,pieceIndex:idx,fromPos:pos,toPos:np});
    this.emit('stateChange',this.state);
    setTimeout(()=>{
      if(np>=39) this.onMoveComplete(pl,idx,np,np);
      else if(CELL_TYPES[np]==='teleport'&&dir===1) this.checkCollision(pl,idx,np,s=>{ if(!s) this._doTeleport(pl,idx,np); });
      else this._resolveCol(pl,idx,np);
    },600);
  }

  checkCollision(mp,mi,pos,cb) {
    if(pos===0||pos>=39) { cb(false); return; }
    const op=1-mp, oP=this.state.players[op], mP=this.state.players[mp];
    const enemies=[];
    for(let i=0;i<2;i++) if(!oP.finished[i]&&oP.pieces[i]===pos) enemies.push(i);
    if(enemies.length) {
      if(this.hasItem(mp,'immovable')) { cb(false); return; }
      if(this.hasItem(op,'immovable')) {
        this.useItem(op,'immovable');
        const np=this.colBelow(pos);
        this._kickDown([{player:mp,index:mi}],np,()=>cb(false));
        return;
      }
      if(this.hasItem(op,'thornArmor')) { this.useItem(op,'thornArmor'); this.loseRandomEquip(mp); }
      const np=this.colBelow(pos);
      this._kickDown(enemies.map(i=>({player:op,index:i})),np,()=>cb(false));
      return;
    }
    let friendly=false;
    for(let i=0;i<2;i++) if(i!==mi&&!mP.finished[i]&&mP.pieces[i]===pos) friendly=true;
    if(friendly) {
      if(this.hasItem(mp,'springArmor')) {
        this.useItem(mp,'springArmor');
        const np=this.colAbove(pos);
        if(!np) { cb(false); return; }
        mP.pieces[mi]=np;
        this.emit('pieceMoved',{player:mp,pieceIndex:mi,fromPos:pos,toPos:np});
        setTimeout(()=>this.checkCollision(mp,mi,np,s=>{ if(!s) this._resolveCell(mp,mi,np); }),300);
        cb(true); return;
      }
      this.emit('stackBonus',{player:mp,pieceIndex:mi,pos});
      this.state.phase='idle'; this.state.diceValue=0; this.state.rerollCount=0;
      cb(true); return;
    }
    cb(false);
  }

  _kickDown(pieces, target, done) {
    if(target===0) {
      pieces.forEach(p=>{ const t=this.state.players[p.player]; if(!t.finished[p.index]) t.pieces[p.index]=0; });
      this.emit('kicked',{pieces,toPos:0});
      setTimeout(done,400); return;
    }
    const existing=[];
    for(let pl=0;pl<2;pl++) for(let i=0;i<2;i++) {
      const t=this.state.players[pl];
      if(!t.finished[i]&&t.pieces[i]===target&&!pieces.some(p=>p.player===pl&&p.index===i)) existing.push({player:pl,index:i});
    }
    pieces.forEach(p=>{ const t=this.state.players[p.player]; if(!t.finished[p.index]) t.pieces[p.index]=target; });
    this.emit('kicked',{pieces,toPos:target});
    if(!existing.length) { setTimeout(done,400); return; }
    setTimeout(()=>this._kickDown(existing,this.colBelow(target),done),400);
  }

  endTurn() {
    if(this.state.extraTurn?.player===this.state.currentPlayer&&this.state.extraTurn.count>0) {
      this.state.extraTurn.count--;
      if(this.state.extraTurn.count<=0) this.state.extraTurn=null;
      this.state.rerollCount=0; this.state.phase='idle'; this.state.diceValue=0;
      this.emit('extraTurn',{player:this.state.currentPlayer});
      this.emit('turnChange',this.state.currentPlayer);
      this.emit('stateChange',this.state); return;
    }
    let next=1-this.state.currentPlayer;
    const nP=this.state.players[next];
    if(nP.allDone) {
      this.state.rerollCount=0; this.state.phase='idle'; this.state.diceValue=0;
      const cP=this.state.players[this.state.currentPlayer];
      if(!cP.allDone&&this.state.endgame) { const pen=Math.min(10,cP.score); cP.score-=pen; this.emit('scoreChange',{player:this.state.currentPlayer,delta:-pen,score:cP.score}); }
      this.emit('turnChange',this.state.currentPlayer);
      this.emit('stateChange',this.state); return;
    }
    this.state.currentPlayer=next;
    this.state.rerollCount=0; this.state.phase='idle'; this.state.diceValue=0;
    const cP=this.state.players[next];
    if(!cP.allDone&&this.state.endgame) { const pen=Math.min(10,cP.score); cP.score-=pen; this.emit('scoreChange',{player:next,delta:-pen,score:cP.score}); }
    this.emit('turnChange',this.state.currentPlayer);
    this.emit('stateChange',this.state);
  }

  // 事件效果
  _triggerEvent(ev,ctx) {
    const en=1-ctx.player;
    if(this.hasItem(en,'financeTrap')&&CELL_TYPES[ctx.pos]==='event') {
      this.useItem(en,'financeTrap');
      const p=this.state.players[ctx.player];
      if(p.score>=18) { p.score-=18; this.emit('scoreChange',{player:ctx.player,delta:-18,score:p.score}); }
      else { this.loseRandomEquip(ctx.player,{fromEvent:true}); p.score=0; }
      ctx.onDone(); return;
    }
    const fn = this['_ev_'+ev.id];
    if(fn) fn.call(this,ctx); else ctx.onDone();
  }

  _ev_redPacket(c){ for(let p=0;p<2;p++){this.state.players[p].score+=8;this.emit('scoreChange',{player:p,delta:8,score:this.state.players[p].score});} c.onDone(); }
  _ev_incomeTax(c){ for(let p=0;p<2;p++){const t=Math.floor(this.state.players[p].score/10);if(t>0){this.state.players[p].score-=t;this.emit('scoreChange',{player:p,delta:-t,score:this.state.players[p].score});}} c.onDone(); }
  _ev_robHood(c){ const s0=this.state.players[0].score,s1=this.state.players[1].score; if(s0===s1){c.onDone();return;} const r=s0>s1?0:1, p=1-r, a=Math.min(3,this.state.players[r].score); this.state.players[r].score-=a; this.state.players[p].score+=a; this.emit('scoreChange',{player:r,delta:-a,score:this.state.players[r].score}); this.emit('scoreChange',{player:p,delta:a,score:this.state.players[p].score}); c.onDone(); }
  _ev_povertyRelief(c){ const s0=this.state.players[0].score,s1=this.state.players[1].score; if(s0===s1){for(let p=0;p<2;p++){this.state.players[p].score+=6;this.emit('scoreChange',{player:p,delta:6,score:this.state.players[p].score});}}else{const p=s0<s1?0:1;this.state.players[p].score+=6;this.emit('scoreChange',{player:p,delta:6,score:this.state.players[p].score});} c.onDone(); }
  _ev_disasterRelief(c){ const e0=this.equipCount(0),e1=this.equipCount(1); if(e0===e1){for(let p=0;p<2;p++){this.state.players[p].score+=6;this.emit('scoreChange',{player:p,delta:6,score:this.state.players[p].score});}}else{const p=e0<e1?0:1;this.state.players[p].score+=6;this.emit('scoreChange',{player:p,delta:6,score:this.state.players[p].score});} c.onDone(); }
  _ev_woodShow(c){
    let mx=-1; const cands=[];
    for(let pl=0;pl<2;pl++) for(let i=0;i<2;i++){const p=this.state.players[pl];if(p.finished[i])continue;const r=this.getRow(p.pieces[i]);if(r===0)continue;if(r>mx){mx=r;cands.length=0;cands.push({player:pl,index:i});}else if(r===mx)cands.push({player:pl,index:i});}
    if(!cands.length){c.onDone();return;}
    const ch=cands[Math.floor(Math.random()*cands.length)];
    this._kickDown([ch],this.colBelow(this.state.players[ch.player].pieces[ch.index]),()=>c.onDone());
  }
  _ev_soaring(c){
    let mn=99; const cands=[];
    for(let pl=0;pl<2;pl++) for(let i=0;i<2;i++){const p=this.state.players[pl];if(p.finished[i])continue;const r=this.getRow(p.pieces[i]);if(r>=4)continue;if(r<mn){mn=r;cands.length=0;cands.push({player:pl,index:i});}else if(r===mn)cands.push({player:pl,index:i});}
    if(!cands.length){c.onDone();return;}
    const ch=cands[Math.floor(Math.random()*cands.length)];
    this._raiseUp([ch],()=>c.onDone());
  }
  _ev_earthquake(c){
    const drops=[];
    for(let pl=0;pl<2;pl++){const ch=[];for(let i=0;i<2;i++){const p=this.state.players[pl];if(!p.finished[i]&&this.getRow(p.pieces[i])>0)ch.push(i);}if(ch.length)drops.push({player:pl,index:ch[Math.floor(Math.random()*ch.length)]});}
    if(!drops.length){c.onDone();return;}
    const next=i=>{ if(i>=drops.length){c.onDone();return;} const{player:pl,index:idx}=drops[i]; this._kickDown([{player:pl,index:idx}],this.colBelow(this.state.players[pl].pieces[idx]),()=>next(i+1)); };
    next(0);
  }
  _ev_bigWind(c){
    const tps=[];
    for(let pl=0;pl<2;pl++){const ch=[];for(let i=0;i<2;i++){if(!this.state.players[pl].finished[i])ch.push(i);}if(ch.length)tps.push({player:pl,index:ch[Math.floor(Math.random()*ch.length)]});}
    tps.forEach(t=>{const cp=this.state.players[t.player].pieces[t.index],r=this.getRow(cp),rs=r*8;const empty=[];for(let cc=0;cc<8;cc++){const p=rs+cc;if(p!==cp&&!this._piecesAt(p).length)empty.push(p);}if(empty.length)this.state.players[t.player].pieces[t.index]=empty[Math.floor(Math.random()*empty.length)];});
    this.emit('stateChange',this.state);
    this._collideList(tps,0,()=>c.onDone());
  }
  _ev_ghostWall(c){
    const mv=[];
    for(let pl=0;pl<2;pl++)for(let i=0;i<2;i++){const p=this.state.players[pl];if(!p.finished[i]&&p.pieces[i]!==0)mv.push({player:pl,index:i,from:p.pieces[i]});}
    const bc={}; mv.forEach(m=>bc[m.from]=(bc[m.from]||0)+1);
    mv.forEach(m=>{const np=Math.max(0,m.from-1);this.state.players[m.player].pieces[m.index]=np;m.to=np;});
    const need=mv.filter(m=>{const sb=bc[m.from]>=2;const as=mv.filter(x=>x!==m&&x.to===m.to).length>=1;return!(sb&&as);});
    this.emit('stateChange',this.state);
    this._collideList(need.map(m=>({player:m.player,index:m.index})),0,()=>c.onDone());
  }
  _ev_hitchhike(c){
    const mv=[];
    for(let pl=0;pl<2;pl++)for(let i=0;i<2;i++){const p=this.state.players[pl];if(!p.finished[i]&&p.pieces[i]!==0&&p.pieces[i]<39)mv.push({player:pl,index:i,from:p.pieces[i]});}
    this._moveList(mv,2,true,()=>c.onDone());
  }
  _ev_lookBehind(c){
    let md=999,ti=-1,tp=-1;
    for(let pl=0;pl<2;pl++)for(let i=0;i<2;i++){if(pl===c.player&&i===c.pieceIndex)continue;const p=this.state.players[pl];if(p.finished[i])continue;const d=Math.abs(p.pieces[i]-c.pos);if(d<md||(d===md&&p.pieces[i]>(tp>=0?this.state.players[tp].pieces[ti]:-1))){md=d;ti=i;tp=pl;}}
    if(ti<0){c.onDone();return;}
    const np=Math.max(0,this.state.players[tp].pieces[ti]-1);
    this.state.players[c.player].pieces[c.pieceIndex]=np;
    this.emit('stateChange',this.state);
    this.checkCollision(c.player,c.pieceIndex,np,()=>c.onDone());
  }
  _ev_forward(c){ this._moveList([{player:c.player,index:c.pieceIndex,from:c.pos}],3,true,()=>c.onDone()); }
  _ev_shopFrenzy(c){
    const r=this.getRow(c.pos),sp=[];

    this.emit('stateChange',this.state);
    this.checkCollision(c.player,c.pieceIndex,t,()=>{this.openShop(c.player);this.pendingCellResolve={player:c.player,pieceIndex:c.pieceIndex,pos:t,afterResolve:()=>c.onDone()};});
  }

  _ev_smashPot(c){this.loseRandomEquip(c.player,{fromEvent:true});this.state.players[c.player].score+=20;this.emit('scoreChange',{player:c.player,delta:20,score:this.state.players[c.player].score});c.onDone();}
  _ev_nakedRun(c){

  _ev_godRewards(c){

    const t=this.drawHigh();
    this.currentTasks=t?[t]:[];
    this.emit('showTask',{player:c.player,tasks:this.currentTasks,label:'天道酬勤'});
    this.pendingCellResolve={player:c.player,pieceIndex:c.pieceIndex,pos:c.pos,afterResolve:()=>{this.restoreRandomEquip(c.player);this.restoreRandomEquip(c.player);c.onDone();}};
  }
  _ev_myTurn(c){const p=this.state.players[c.player];const cost=Math.min(3,p.score);p.score-=cost;this.emit('scoreChange',{player:c.player,delta:-cost,score:p.score});if(this.state.extraTurn?.player===c.player)this.state.extraTurn.count++;else this.state.extraTurn={player:c.player,count:1};c.onDone();}
  _ev_teleportMagic(c){
    const tr=[];
    for(let pl=0;pl<2;pl++){const ch=[];for(let i=0;i<2;i++){if(!this.state.players[pl].finished[i]&&this.getRow(this.state.players[pl].pieces[i])<4)ch.push(i);}if(ch.length)tr.push({player:pl,index:ch[Math.floor(Math.random()*ch.length)]});}
    if(!tr.length){c.onDone();return;}
    this._raiseUp(tr,()=>c.onDone());
  }
  _ev_gearUp(c){this.restoreRandomEquip(c.player);const en=1-c.player;if(this.state.extraTurn?.player===en)this.state.extraTurn.count+=2;else this.state.extraTurn={player:en,count:2};c.onDone();}
  _ev_emptyTask(c){const p=this.state.players[c.player],n=p.equipment.filter(e=>!e.on).length,r=n*2;p.score+=r;this.emit('scoreChange',{player:c.player,delta:r,score:p.score});c.onDone();}
  _ev_stockTrade(c){const p=this.state.players[c.player],d=Math.floor(Math.random()*11)-4;if(d<0){const l=Math.min(-d,p.score);p.score-=l;this.emit('scoreChange',{player:c.player,delta:-l,score:p.score});}else{p.score+=d;this.emit('scoreChange',{player:c.player,delta:d,score:p.score});}c.onDone();}
  _ev_amnesia(c){for(let p=0;p<2;p++)this.state.players[p].skipClothesStreak=0;this.emit('stateChange',this.state);c.onDone();}

  // 辅助
  _piecesAt(pos){const r=[];for(let pl=0;pl<2;pl++)for(let i=0;i<2;i++){const p=this.state.players[pl];if(!p.finished[i]&&p.pieces[i]===pos)r.push({player:pl,index:i});}return r;}
  _raiseUp(pieces,done){
    pieces.forEach(p=>{const np=this.colAbove(this.state.players[p.player].pieces[p.index]);if(np!==null)this.state.players[p.player].pieces[p.index]=np;});
    this.emit('stateChange',this.state);
    this._collideList(pieces,0,done);
  }
  _collideList(list,i,done){if(i>=list.length){done();return;}const p=list[i],pos=this.state.players[p.player].pieces[p.index];if(pos===0||pos>=39){this._collideList(list,i+1,done);return;}this.checkCollision(p.player,p.index,pos,()=>this._collideList(list,i+1,done));}
  _moveList(movers,steps,tc,done){
    const next=i=>{
      if(i>=movers.length){done();return;}
      const m=movers[i],from=this.state.players[m.player].pieces[m.index],to=Math.min(39,from+steps);
      if(to===from||this.state.players[m.player].finished[m.index]){next(i+1);return;}
      const fr=this.getRow(from),tr=this.getRow(to),p=this.state.players[m.player];
      const after=()=>{
        this.state.players[m.player].pieces[m.index]=to;
        if(to>=39){this.state.players[m.player].finished[m.index]=true;this.emit('pieceFinished',{player:m.player,pieceIndex:m.index});next(i+1);return;}
        this.emit('stateChange',this.state);
        this.checkCollision(m.player,m.index,to,()=>next(i+1));
      };
      if(tc&&tr>fr&&this.equipCount(m.player)>0){
        if(this.hasItem(m.player,'freeClothes')){this.useItem(m.player,'freeClothes');p.skipClothesStreak=0;after();}
        else{
          this.state.phase='clothesChoice';
          this.pendingCellResolve={player:m.player,pieceIndex:m.index,pos:to,afterResolve:()=>{this.state.players[m.player].pieces[m.index]=to;if(to>=39){this.state.players[m.player].finished[m.index]=true;this.emit('pieceFinished',{player:m.player,pieceIndex:m.index});next(i+1);return;}this.checkCollision(m.player,m.index,to,()=>next(i+1));}};
          this.emit('showClothesChoice',{player:m.player,pieceIndex:m.index,pos:to,price:this.getSkipPrice(m.player),canAfford:p.score>=this.getSkipPrice(m.player)});
          return;
        }
      }else after();
    };
    next(0);
  }

  openShop(player) {
    const p=this.state.players[player],en=1-player;
    const hasR=this.hasItem(player,'restockCard'),eC=hasR?2:1,nC=hasR?6:4;
    const eItems=shuffle([...EQUIPMENT_ITEMS]).slice(0,eC).map(eq=>{
      const pe=p.equipment.find(e=>e.id===eq.id),owned=pe?pe.on:false;
      let price=10+Math.floor(Math.random()*6);
      if(this.hasItem(player,'vipCard'))price=Math.floor(price/2);
      if(this.hasItem(en,'capitalCard'))price+=5;
      return{id:'eq_'+eq.id,type:'equipment',equipId:eq.id,name:eq.name,icon:eq.icon,desc:'恢复'+eq.name,price,owned,purchased:false};
    });
    const avail=Object.entries(ITEM_DEFS).filter(([id])=>!p.inventory[id]).map(([id,d])=>({id,...d}));
    const nItems=shuffle(avail).slice(0,nC).map(it=>{
      let price=it.price;
      if(this.hasItem(player,'vipCard'))price=Math.floor(price/2);
      if(this.hasItem(en,'capitalCard'))price+=5;
      return{id:'it_'+it.id,type:'normal',itemId:it.id,name:it.name,icon:it.icon,desc:it.desc,price,purchased:false};
    });
    this.shopItems=[...eItems,...nItems];
    if(hasR){this.useItem(player,'restockCard');}
    if(this.hasItem(en,'capitalCard')){this.useItem(en,'capitalCard');}
    if(this.hasItem(player,'vipCard')){this.useItem(player,'vipCard');}
    this.emit('showShop',{player,items:this.shopItems,score:p.score});
  }
  buyItem(itemId) {
    const item=this.shopItems.find(i=>i.id===itemId);
    if(!item||item.purchased)return;
    const p=this.state.players[this.state.currentPlayer];
    if(p.score<item.price)return;
    if(item.type==='equipment'&&item.owned)return;
    if(item.type==='normal'&&p.inventory[item.itemId])return;
    p.score-=item.price;item.purchased=true;
    if(item.type==='equipment'){const eq=p.equipment.find(e=>e.id===item.equipId);if(eq){eq.on=true;item.owned=true;}}
    else this.addItem(this.state.currentPlayer,item.itemId);
    this.emit('scoreChange',{player:this.state.currentPlayer,delta:-item.price,score:p.score});
    this.emit('itemPurchased',{item});
  }
  closeShop(){this.emit('hideShop');this._finishResolve();}
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function parseTasks(raw){return raw.trim().split('\n').map((line,i)=>{const[t,r]=line.split('|');return{id:'t'+i,desc:t.trim(),reward:parseInt(r,10)||3};});}

// ============================================================
//  NetworkController
// ============================================================
class NetworkController {
  constructor(){this.ws=null;this.roomId=null;this.playerIndex=-1;this.isHost=false;this.state=null;this.listeners={};}
  on(e,cb){(this.listeners[e]=this.listeners[e]||[]).push(cb);}
  emit(e,d){(this.listeners[e]||[]).forEach(cb=>cb(d));}
  connect(){return new Promise((res,rej)=>{const proto=location.protocol==='https:'?'wss:':'ws:';const url=`${proto}//${location.host}/ws`;let done=false;this.ws=new WebSocket(url);const t=setTimeout(()=>{if(!done){done=true;rej(new Error('连接超时'));try{this.ws.close();}catch(e){}}},8000);this.ws.onopen=()=>{if(done)return;done=true;clearTimeout(t);res();};this.ws.onerror=()=>{if(done)return;done=true;clearTimeout(t);rej(new Error('连接失败'));};this.ws.onclose=()=>{if(!done){done=true;clearTimeout(t);rej(new Error('服务器未启动'));return;}this.emit('disconnected');};this.ws.onmessage=evt=>{try{const m=JSON.parse(evt.data);this._handle(m);}catch(e){}};});}
  send(type,data){if(this.ws?.readyState===1)this.ws.send(JSON.stringify({type,data}));}
  _handle(m){const{type,data}=m;switch(type){case'roomCreated':this.roomId=data.roomId;this.playerIndex=data.playerIndex;this.isHost=data.isHost;this.emit('roomCreated',data);break;case'roomJoined':this.roomId=data.roomId;this.playerIndex=data.playerIndex;this.isHost=data.isHost;this.emit('roomJoined',data);break;case'playerJoined':this.emit('playerJoined',data);break;case'gameStart':this.emit('gameStart');break;case'opponentDisconnected':this.emit('opponentDisconnected');break;case'roomLeft':this.emit('roomLeft');break;case'error':this.emit('error',m.message);break;case'gameEvent':if(data.event==='stateChange')this.state=data;this.emit(data.event,data);break;}}
  createRoom(){this.send('createRoom');}
  joinRoom(id){this.send('joinRoom',{roomId:id});}
  leaveRoom(){this.send('leaveRoom');}
  rollDice(){this.send('gameAction',{action:'rollDice'});}
  rerollDice(){this.send('gameAction',{action:'rerollDice'});}
  movePiece(i){this.send('gameAction',{action:'movePiece',payload:{pieceIndex:i}});}
  selectTask(i){this.send('gameAction',{action:'selectTask',payload:{taskIndex:i}});}
  closeEvent(){this.send('gameAction',{action:'closeEvent'});}
  takeOffEquipment(pl,idx,pos,eIdx){this.send('gameAction',{action:'takeOffEquipment',payload:{pieceIndex:idx,pos,equipIndex:eIdx}});}
  buySkipClothes(pl,idx,pos){this.send('gameAction',{action:'buySkipClothes',payload:{pieceIndex:idx,pos}});}
  buyItem(id){this.send('gameAction',{action:'buyItem',payload:{itemId:id}});}
  closeShop(){this.send('gameAction',{action:'closeShop'});}
  onDiceAnimEnd(){}
  onMoveComplete(){}
}

// ============================================================
//  UIController
// ============================================================
class UIController {
  constructor(game, opts={}){
    this.game=game;
    this.mode=opts.mode||'local';
    this.myIdx=opts.myPlayerIndex??-1;
    this.$=id=>document.getElementById(id);
    this.cells=[];this.pieceEls=[];
    this._autoPiece=null;
    this._initBoard();
    this._bindEvents();
    this._bindGame();
    this.updateUI(this.game.state);
  }

  _initBoard(){
    const board=this.$('board');
    board.innerHTML='';
    for(let row=4;row>=0;row--){
      for(let col=0;col<8;col++){
        const pos=row*8+(row%2===0?col:(7-col));
        const type=CELL_TYPES[pos];
        const cell=document.createElement('div');
        cell.className=`cell cell-${type}`;
        cell.innerHTML=`<span class="cell-index">${pos}</span><div class="relative z-10 text-center leading-tight"><div class="text-base md:text-lg">${CELL_ICONS[type]}</div><div class="hidden md:block text-[9px]">${CELL_LABELS[type]}</div></div>`;
        board.appendChild(cell);
        this.cells[pos]=cell;
      }
    }
    for(let p=0;p<2;p++){
      this.pieceEls[p]=[];
      for(let i=0;i<2;i++){
        const el=document.createElement('div');
        el.className=`piece piece-p${p+1}`;
        el.textContent=i+1;
        board.appendChild(el);
        this.pieceEls[p][i]=el;
      }
    }
  }

  _bindEvents(){
    this.$('diceContainer').addEventListener('click',()=>this._onDiceClick());
    this.$('taskCard1').addEventListener('click',()=>{this.game.selectTask(0);});
    this.$('taskCard2').addEventListener('click',()=>{this.game.selectTask(1);});
    this.$('eventClose').addEventListener('click',()=>this.game.closeEvent());
    this.$('shopClose').addEventListener('click',()=>this.game.closeShop());
    this.$('rerollDiceBtn').addEventListener('click',()=>this.game.rerollDice());
    this.$('clothesSkipBtn').addEventListener('click',()=>{
      if(this._clothesData)this.game.buySkipClothes(this._clothesData.player,this._clothesData.pieceIndex,this._clothesData.pos);
    });
  }

  _bindGame(){
    const g=this.game;
    g.on('stateChange',s=>this.updateUI(s));
    g.on('diceRoll',({value})=>this._animateDice(value));
    g.on('selectPiece',v=>this._enableSelect(v));
    g.on('pieceMove',d=>this._animateMove(d.player,d.pieceIndex,d.fromPos,d.toPos));
    g.on('pieceFinished',({player,pieceIndex})=>{
      this.pieceEls[player][pieceIndex].classList.add('piece-finished');
      this._info(`玩家${player+1}的棋子到达终点！`);
      this._particles(window.innerWidth/2,window.innerHeight/2,player===0?'#60a5fa':'#f472b6',20);
    });
    g.on('showTask',({player,tasks,label})=>{
      if(this.mode==='online'&&player!==this.myIdx){this._info('对方选择任务中...');return;}
      this._showTask(player,tasks,label);
    });
    g.on('hideTask',()=>this._hideModal('taskModal'));
    g.on('showEvent',({player,event})=>{
      if(this.mode==='online'&&player!==this.myIdx){this._info('对方触发事件...');return;}
      this._showEvent(event);
    });
    g.on('hideEvent',()=>this._hideModal('eventModal'));
    g.on('showShop',({player,items,score})=>{
      if(this.mode==='online'&&player!==this.myIdx){this._info('对方购物中...');return;}
      this._showShop(items,score);
    });
    g.on('hideShop',()=>this._hideModal('shopModal'));
    g.on('scoreChange',({player,delta})=>this._scorePopup(player,delta));
    g.on('itemPurchased',()=>this._refreshShop());
    g.on('teleport',({player,pieceIndex,toPos})=>{
      this._animateTeleport(player,pieceIndex,toPos);
    });
    g.on('kicked',()=>{this._info('💥 棋子被踢落！');this._positionPieces();});
    g.on('stackBonus',({player,pieceIndex})=>{
      this._info('✨ 叠棋！再掷一次');
      this._autoPiece=pieceIndex;
      this._particles(window.innerWidth/2,window.innerHeight/2,'#fbbf24',15);
    });
    g.on('showClothesChoice',d=>{
      if(this.mode==='online'&&d.player!==this.myIdx){this._info('对方选择脱装备...');return;}
      this._showClothes(d);
    });
    g.on('hideClothesChoice',()=>this._hideModal('clothesModal'));
    g.on('equipmentChange',()=>this._updateEquip());
    g.on('inventoryChange',()=>this._updateInv());
    g.on('itemEffect',({detail})=>this._info('✨ '+detail));
    g.on('eventEffect',({detail})=>this._info('⚡ '+detail));
    g.on('extraTurn',({player})=>this._info(`🔥 玩家${player+1}额外回合！`));
    g.on('showRerollChoice',d=>this._showReroll(d));
    g.on('turnChange',p=>this._highlightPlayer(p));
    g.on('victory',d=>this._showVictory(d));
  }

  updateUI(s){
    if(!s)return;
    this._positionPieces();
    this._updateScores(s);
    this._updateEquip();
    this._updateInv();
    this._highlightPlayer(s.currentPlayer);
    const di=this.$('diceContainer');
    if(s.phase==='idle'){di.classList.add('can-roll');di.classList.remove('rolling');this.$('diceHint').textContent='点击骰子投掷';}
    else{di.classList.remove('can-roll');}
  }

  _positionPieces(){
    const s=this.game.state;if(!s)return;
    const board=this.$('board').getBoundingClientRect();
    for(let p=0;p<2;p++){
      for(let i=0;i<2;i++){
        const el=this.pieceEls[p][i];
        const pos=s.players[p].pieces[i];
        const cell=this.cells[pos];
        if(!cell)continue;
        const cr=cell.getBoundingClientRect();
        let x=cr.left-board.left+cr.width/2;
        let y=cr.top-board.top+cr.height/2;
        // 同格棋子错开：2x2排列
        const same=[];
        for(let pp=0;pp<2;pp++)for(let ii=0;ii<2;ii++){
          if(!s.players[pp].finished[ii]&&s.players[pp].pieces[ii]===pos)same.push({pp,ii});
        }
        if(same.length>1){
          const idx=same.findIndex(o=>o.pp===p&&o.ii===i);
          const offs=[[-7,-5],[7,-5],[-7,5],[7,5]];
          x+=offs[idx]?.[0]||0;
          y+=offs[idx]?.[1]||0;
        }
        el.style.left=x+'px';
        el.style.top=y+'px';
        if(s.players[p].finished[i])el.classList.add('piece-finished');else el.classList.remove('piece-finished');
      }
    }
  }

  _updateScores(s){
    this.$('p1Score').textContent=s.players[0].score;
    this.$('p2Score').textContent=s.players[1].score;
  }

  _updateEquip(){
    const s=this.game.state;if(!s)return;
    for(let p=0;p<2;p++){
      const c=this.$(`p${p+1}Equipment`);
      c.innerHTML='';
      s.players[p].equipment.forEach(eq=>{
        const d=document.createElement('div');
        d.className=`equip-slot ${eq.on?'on':'off'}`;
        d.title=eq.name;
        d.textContent=eq.icon;
        c.appendChild(d);
      });
    }
  }

  _updateInv(){
    const s=this.game.state;if(!s)return;
    for(let p=0;p<2;p++){
      const c=this.$(`p${p+1}Inventory`);
      c.innerHTML='';
      Object.entries(s.players[p].inventory).forEach(([id,ch])=>{
        const d=ITEM_DEFS[id];if(!d)return;
        const el=document.createElement('div');
        el.className='inv-item';
        el.title=`${d.name}：${d.desc}`;
        el.innerHTML=`${d.icon}<span class="charges">${ch}</span>`;
        c.appendChild(el);
      });
    }
  }

  _highlightPlayer(p){
    this.$('turnIndicator').textContent=`P${p+1} 回合`;
    this.$('turnIndicator').style.color=p===0?'var(--p1)':'var(--p2)';
    this.$('p1Info').style.borderColor=p===0?'var(--p1)':'transparent';
    this.$('p1Info').style.boxShadow=p===0?'0 0 15px var(--p1-glow)':'none';
    this.$('p2Info').style.borderColor=p===1?'var(--p2)':'transparent';
    this.$('p2Info').style.boxShadow=p===1?'0 0 15px var(--p2-glow)':'none';
  }

  _onDiceClick(){
    const s=this.game.state;if(!s||s.phase!=='idle')return;
    if(this.mode==='online'&&s.currentPlayer!==this.myIdx)return;
    this.game.rollDice();
  }

  _animateDice(value){
    const dc=this.$('diceContainer'),dice=this.$('dice'),df=this.$('diceFinal');
    dc.classList.add('rolling');dc.classList.remove('can-roll');
    dc.classList.remove('show-final');
    this.$('rerollBar').classList.add('hidden');
    this.$('diceHint').textContent='掷骰中...';
    dice.style.transition='none';
    dice.style.transform='rotateX(0deg) rotateY(0deg) rotateZ(0deg)';
    void dice.offsetWidth;
    const sx=5+Math.floor(Math.random()*4),sy=6+Math.floor(Math.random()*4),sz=2+Math.floor(Math.random()*3);
    const ex=(Math.random()<.5?-1:1)*sx*360+(Math.random()-.5)*180;
    const ey=(Math.random()<.5?-1:1)*sy*360+(Math.random()-.5)*180;
    const ez=(Math.random()<.5?-1:1)*sz*360;
    requestAnimationFrame(()=>{
      dice.style.transition='transform 1.3s cubic-bezier(0.12,0.82,0.22,1)';
      dice.style.transform=`rotateX(${ex}deg) rotateY(${ey}deg) rotateZ(${ez}deg)`;
    });
    const dr=dc.getBoundingClientRect();
    this._particles(dr.left+dr.width/2,dr.top+dr.height/2,'#60a5fa',10);
    setTimeout(()=>{
      this._renderDiceFace(value);
      dc.classList.add('show-final');
    },1050);
    setTimeout(()=>{
      this.$('diceHint').textContent=`点数 ${value}`;
      dc.classList.remove('rolling');
      this.game.onDiceAnimEnd();
    },1300);
  }

  _renderDiceFace(v){
    const pos={1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[1,3],[3,1],[3,3]],5:[[1,1],[1,3],[2,2],[3,1],[3,3]],6:[[1,1],[2,1],[3,1],[1,3],[2,3],[3,3]]};
    const dots=pos[v]||pos[1];
    this.$('diceFinal').innerHTML=dots.map(([r,c])=>`<span class="dot" style="grid-row:${r};grid-column:${c}"></span>`).join('');
  }

  _showReroll(d){
    this.$('diceHint').textContent=`点数 ${d.diceValue}`;
    const bar=this.$('rerollBar');
    bar.classList.remove('hidden');
    const btn=this.$('rerollDiceBtn');
    btn.querySelector('span').textContent=`(花费${d.rerollCost})`;
    btn.disabled=!d.canAfford;
    btn.style.opacity=d.canAfford?'1':'0.4';
  }

  _enableSelect(steps){
    const s=this.game.state,cur=s.currentPlayer,p=s.players[cur];
    if(this._autoPiece!==null&&this._autoPiece!==undefined){
      const idx=this._autoPiece;this._autoPiece=null;
      if(!p.finished[idx]){this._info(`叠棋奖励！自动前进`);setTimeout(()=>this._selectPiece(idx),200);return;}
    }
    for(let i=0;i<2;i++){
      const el=this.pieceEls[cur][i];
      el.classList.remove('selectable');
      el.onclick=null;
      if(!p.finished[i]){
        el.classList.add('selectable');
        el.onclick=()=>this._selectPiece(i);
      }
    }
    this._info(`玩家${cur+1}掷出${steps}点，选择棋子`);
    const avail=[0,1].filter(i=>!p.finished[i]);
    if(avail.length===1)setTimeout(()=>this._selectPiece(avail[0]),500);
  }

  _selectPiece(idx){
    const cur=this.game.state.currentPlayer;
    for(let i=0;i<2;i++){this.pieceEls[cur][i].classList.remove('selectable');this.pieceEls[cur][i].onclick=null;}
    this.game.movePiece(idx);
  }

  async _animateMove(player,idx,from,to){
    const el=this.pieceEls[player][idx];
    const board=this.$('board').getBoundingClientRect();
    for(let i=1;i<=to-from;i++){
      const pos=from+i;
      const cell=this.cells[pos];if(!cell)break;
      const cr=cell.getBoundingClientRect();
      el.style.left=(cr.left-board.left+cr.width/2)+'px';
      el.style.top=(cr.top-board.top+cr.height/2)+'px';
      el.style.transform='translate(-50%,-60%) scale(1.15)';
      await new Promise(r=>setTimeout(r,110));
      el.style.transform='translate(-50%,-50%) scale(1)';
      await new Promise(r=>setTimeout(r,70));
    }
    this.game.onMoveComplete(player,idx,from,to);
    requestAnimationFrame(()=>requestAnimationFrame(()=>this._positionPieces()));
  }

  _animateTeleport(player,idx,to){
    const el=this.pieceEls[player][idx];
    el.style.transform='translate(-50%,-50%) scale(0) rotate(360deg)';
    el.style.opacity='0';
    setTimeout(()=>{
      this._positionPieces();
      el.style.transform='translate(-50%,-50%) scale(0)';
      el.style.opacity='0';
      void el.offsetWidth;
      el.style.transform='translate(-50%,-50%) scale(1.3)';
      el.style.opacity='1';
      const cell=this.cells[to];
      if(cell){const cr=cell.getBoundingClientRect();const br=this.$('board').getBoundingClientRect();this._particles(cr.left-br.left+cr.width/2,cr.top-br.top+cr.height/2,'#2dd4bf',15);}
      setTimeout(()=>{el.style.transform='translate(-50%,-50%) scale(1)';requestAnimationFrame(()=>requestAnimationFrame(()=>this._positionPieces()));},200);
    },300);
  }

  _showTask(player,tasks,label){
    const p=this.game.state.players[player];
    const bonus=p.equipment.filter(e=>!e.on).length*2;
    const fmt=r=>bonus>0?`<span class="text-gray-400">${r}</span> <span class="text-purple-300">(+${bonus})</span> = <span class="text-yellow-400">${r+bonus}</span>`:`+${r}分`;
    this.$('taskCard1').querySelector('h3')?.remove();
    const title=document.createElement('h3');
    title.className='font-display text-lg font-bold text-center mb-3 col-span-2';
    title.textContent=label?`🎯 ${label}`:'🎯 任务挑战';
    this.$('taskText1').textContent=tasks[0]?.desc||'';
    this.$('taskReward1').innerHTML=fmt(tasks[0]?.reward||0);
    this.$('taskText2').textContent=tasks[1]?.desc||'';
    this.$('taskReward2').innerHTML=fmt(tasks[1]?.reward||0);
    const modal=this.$('taskModal');
    modal.classList.remove('hidden');modal.classList.add('flex');
    const c1=this.$('taskCard1'),c2=this.$('taskCard2');
    c1.classList.remove('card-reveal');c2.classList.remove('card-reveal');
    void c1.offsetWidth;
    c1.classList.add('card-reveal');
    setTimeout(()=>c2.classList.add('card-reveal'),150);
  }

  _showEvent(ev){
    this.$('eventNameDisplay').textContent=ev.name;
    this.$('eventDesc').textContent=ev.desc;
    const m=this.$('eventModal');m.classList.remove('hidden');m.classList.add('flex');
  }

  _showShop(items,score){
    this.$('shopScore').textContent=score;
    const c=this.$('shopItems');c.innerHTML='';
    items.forEach(item=>{
      const owned=item.type==='equipment'&&item.owned;
      const canBuy=!item.purchased&&!owned&&score>=item.price;
      const div=document.createElement('div');
      div.className=`shop-item ${item.purchased?'purchased':owned?'owned':canBuy?'':'opacity-60'}`;
      div.innerHTML=`<div class="flex items-center gap-2 mb-1"><span class="text-lg">${item.icon}</span><span class="text-sm font-bold">${item.name}</span></div><p class="text-xs text-gray-400 mb-2">${item.desc}</p><div class="flex items-center justify-between"><span class="text-yellow-400 font-bold text-sm">💰 ${item.price}</span>${item.purchased?'<span class="text-xs text-green-400">✓已购</span>':owned?'<span class="text-xs text-gray-500">已拥有</span>':canBuy?'<span class="text-xs text-blue-400">点击购买</span>':'<span class="text-xs text-red-400">积分不足</span>'}</div>`;
      if(canBuy)div.onclick=()=>this.game.buyItem(item.id);
      c.appendChild(div);
    });
    const m=this.$('shopModal');m.classList.remove('hidden');m.classList.add('flex');
  }

  _refreshShop(){
    const s=this.game.state;
    if(s)this._showShop(this.game.shopItems,s.players[s.currentPlayer].score);
  }

  _showClothes(d){
    this._clothesData=d;
    const p=this.game.state.players[d.player];
    this.$('clothesScore').textContent=p.score;
    this.$('clothesPrice').textContent=d.price;
    const list=this.$('clothesList');list.innerHTML='';
    p.equipment.forEach((eq,i)=>{
      const btn=document.createElement('button');
      btn.className=`equip-slot ${eq.on?'on hover:scale-110 cursor-pointer':'off cursor-not-allowed'}`;
      btn.textContent=eq.icon;
      btn.title=eq.name;
      if(eq.on)btn.onclick=()=>{this._hideModal('clothesModal');this.game.takeOffEquipment(d.player,d.pieceIndex,d.pos,i);};
      else btn.disabled=true;
      list.appendChild(btn);
    });
    const skip=this.$('clothesSkipBtn');
    skip.disabled=!d.canAfford;
    skip.style.opacity=d.canAfford?'1':'0.4';
    const m=this.$('clothesModal');m.classList.remove('hidden');m.classList.add('flex');
  }

  _showVictory(d){
    const{winner,score0,score1}=d;
    this.$('victoryText').textContent=winner===-1?'⚖️ 平局！':`玩家${winner+1} 获胜！`;
    this.$('victorySubtitle').textContent=`最终积分 — 玩家1：${score0}　玩家2：${score1}`;
    const m=this.$('victoryModal');m.classList.remove('hidden');m.classList.add('flex');
  }

  _hideModal(id){const m=this.$(id);m.classList.add('hidden');m.classList.remove('flex');}

  _info(t){const el=this.$('infoText');el.textContent=t;el.classList.remove('fade-in');void el.offsetWidth;el.classList.add('fade-in');}

  _scorePopup(player,delta){
    const el=this.$(`p${player+1}Score`);
    const p=document.createElement('div');
    p.className='score-popup';
    p.textContent=(delta>=0?'+':'')+delta;
    p.style.color=delta>=0?(player===0?'#60a5fa':'#f472b6'):'#ef4444';
    p.style.left='50%';p.style.top='-10px';p.style.transform='translateX(-50%)';
    el.parentElement.style.position='relative';
    el.parentElement.appendChild(p);
    setTimeout(()=>p.remove(),1200);
    el.style.transform='scale(1.3)';el.style.transition='transform 0.2s';
    setTimeout(()=>el.style.transform='scale(1)',200);
  }

  _particles(x,y,color,count=12){
    const c=this.$('particleContainer');
    for(let i=0;i<count;i++){
      const p=document.createElement('div');
      p.className='particle';
      p.style.left=x+'px';p.style.top=y+'px';
      p.style.background=color;p.style.boxShadow=`0 0 8px ${color}`;
      const s=4+Math.random()*6;p.style.width=s+'px';p.style.height=s+'px';
      c.appendChild(p);
      const a=Math.PI*2*i/count+Math.random()*0.5,d=40+Math.random()*80;
      p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`,opacity:0}],{duration:800+Math.random()*400,easing:'cubic-bezier(0.25,0.46,0.45,0.94)',fill:'forwards'}).onfinish=()=>p.remove();
    }
  }
}

// ============================================================
//  App
// ============================================================
const App={
  mode:null,game:null,ui:null,network:null,
  init(){
    this.$=id=>document.getElementById(id);
    this.$('modeLocal').onclick=()=>this._localMode();
    this.$('modeCreate').onclick=()=>this._createRoom();
    this.$('modeJoin').onclick=()=>{this.$('joinModal').classList.remove('hidden');this.$('joinModal').classList.add('flex');};
    this.$('joinModalCancel').onclick=()=>{this.$('joinModal').classList.add('hidden');this.$('joinModal').classList.remove('flex');};
    this.$('joinModalConfirm').onclick=()=>this._joinRoom();
    this.$('joinRoomInput').onkeydown=e=>{if(e.key==='Enter')this._joinRoom();};
    this.$('copyRoomId').onclick=()=>this._copyRoom();
    this.$('leaveRoomBtn').onclick=()=>this._leave();
    this.$('disconnectBackBtn').onclick=()=>this._home();
    this.$('addDefaultTasks').onclick=()=>{this.$('taskConfig').value=DEFAULT_TASKS_RAW;};
    this.$('startGame').onclick=()=>this._startLocal();
    this.$('backToConfig').onclick=()=>this._home();
    this.$('restartGame').onclick=()=>{if(this.mode==='local'){this.game=new LocalController(parseTasks(this.$('taskConfig').value||DEFAULT_TASKS_RAW));this.ui=new UIController(this.game,{mode:'local'});this._show('game');}};
    this.$('playAgain').onclick=()=>{this.$('victoryModal').classList.add('hidden');this.$('victoryModal').classList.remove('flex');if(this.mode==='local'){this.game=new LocalController(parseTasks(this.$('taskConfig').value||DEFAULT_TASKS_RAW));this.ui=new UIController(this.game,{mode:'local'});this._show('game');}};
    this.$('victoryConfig').onclick=()=>{this.$('victoryModal').classList.add('hidden');this.$('victoryModal').classList.remove('flex');this._home();};
    this._show('home');
  },
  _show(v){
    ['homeView','configView','lobbyView','gameView'].forEach(id=>{
      const el=this.$(id);
      if(id===v+'View'){el.classList.remove('hidden');if(id==='gameView'||id==='lobbyView')el.classList.add('flex');}
      else{el.classList.add('hidden');el.classList.remove('flex');}
    });
  },
  _toast(msg,type='info'){
    const el=document.createElement('div');
    el.className='fixed top-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-xl text-sm font-medium shadow-2xl backdrop-blur-md transition-all duration-300';
    el.style.background=type==='error'?'hsla(350,80%,30%,0.85)':'hsla(220,60%,25%,0.85)';
    el.style.color='white';el.style.border='1px solid rgba(255,255,255,0.15)';
    el.style.opacity='0';el.style.transform='translate(-50%,-10px)';
    el.textContent=msg;document.body.appendChild(el);
    requestAnimationFrame(()=>{el.style.opacity='1';el.style.transform='translate(-50%,0)';});
    setTimeout(()=>{el.style.opacity='0';el.style.transform='translate(-50%,-10px)';setTimeout(()=>el.remove(),300);},2500);
  },
  _localMode(){this.mode='local';this._show('config');},
  _startLocal(){
    const raw=this.$('taskConfig').value.trim();
    const tasks=raw?parseTasks(raw):parseTasks(DEFAULT_TASKS_RAW);
    if(tasks.filter(t=>t.reward<=4).length<2||tasks.filter(t=>t.reward>=5).length<2){
      this._toast('至少需要2个1-4分任务和2个5-8分任务','error');return;
    }
    this.game=new LocalController(tasks);
    this.ui=new UIController(this.game,{mode:'local'});
    this._show('game');
  },
  async _createRoom(){
    try{
      this.network=new NetworkController();
      await this.network.connect();
      this._bindNet();
      this.network.createRoom();
    }catch(e){this._toast(e.message||'连接失败','error');}
  },
  async _joinRoom(){
    const id=this.$('joinRoomInput').value.trim();
    if(!/^\d{6}$/.test(id)){this._toast('请输入6位房间号','error');return;}
    try{
      this.network=new NetworkController();
      await this.network.connect();
      this._bindNet();
      this.network.joinRoom(id);
      this.$('joinModal').classList.add('hidden');this.$('joinModal').classList.remove('flex');
    }catch(e){this._toast(e.message||'连接失败','error');}
  },
  _bindNet(){
    const n=this.network;
    n.on('roomCreated',d=>{this.$('roomIdDisplay').textContent=d.roomId;this.$('lobbyTitle').textContent='等待加入';this.$('lobbyP1Name').textContent='你（房主）';this.$('lobbyP2Name').textContent='等待中...';this._show('lobby');});
    n.on('roomJoined',d=>{this.$('roomIdDisplay').textContent=d.roomId;this.$('lobbyTitle').textContent='已加入';this.$('lobbyP1Name').textContent='房主';this.$('lobbyP2Name').textContent='你';this._show('lobby');});
    n.on('playerJoined',()=>{this.$('lobbyP2Name').textContent='玩家2 已加入';if(n.isHost)setTimeout(()=>n.send('startGame'),800);});
    n.on('gameStart',()=>{this.mode='online';this.game=this.network;this.ui=new UIController(this.game,{mode:'online',myPlayerIndex:this.network.playerIndex});this._show('game');requestAnimationFrame(()=>this.ui._positionPieces());});
    n.on('opponentDisconnected',()=>{this.$('disconnectModal').classList.remove('hidden');this.$('disconnectModal').classList.add('flex');});
    n.on('error',msg=>this._toast(msg||'错误','error'));
  },
  _copyRoom(){
    const id=this.$('roomIdDisplay').textContent;
    navigator.clipboard?.writeText(id).then(()=>{const b=this.$('copyRoomId');const t=b.textContent;b.textContent='✅ 已复制';setTimeout(()=>b.textContent=t,1500);}).catch(()=>{});
  },
  _leave(){if(this.network){this.network.leaveRoom();try{this.network.ws?.close();}catch(e){}this.network=null;}this._home();},
  _home(){
    this.$('disconnectModal').classList.add('hidden');this.$('disconnectModal').classList.remove('flex');
    if(this.network){try{this.network.ws?.close();}catch(e){}this.network=null;}
    this.game=null;this.ui=null;this._show('home');
  }
};

App.init();
window.addEventListener('resize',()=>{if(App.ui?.game?.state)App.ui._positionPieces();});
</script>
</body>
